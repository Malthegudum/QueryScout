
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryscout"
version = "0.1.0"
description = "AI assistant for querying statistical APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "requests",
    "pydantic",
    "pydantic-ai",
    "python-dotenv",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]