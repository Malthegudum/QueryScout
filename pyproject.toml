[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryscout"
version = "0.3.0"
description = "Simple MCP server for statistical data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "pandas",
    "requests",
]

[project.scripts]
queryscout = "queryscout.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"queryscout" = ["instructions.md"]
