[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryscout"
version = "0.2.0"
description = "Simple MCP server for statistical APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "requests",
]

[project.scripts]
queryscout = "queryscout.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"queryscout.sources.dst" = ["instructions.md"]
